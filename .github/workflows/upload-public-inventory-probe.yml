name: Upload public A100 inventory probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  upload-and-verify:
    if: github.repository == 'Eta06/HarbiChess' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Upload the fixed public manifest and verify public readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upload_public_inventory_probe.py
