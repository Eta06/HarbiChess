[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harbichess"
version = "0.1.0.dev0"
description = "A neural-guided chess engine trained through reinforcement learning and self-play."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Eta06" }]
dependencies = [
  "chess>=1.11,<2",
  "mlx>=0.32,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
parity = ["mlx[cpu]>=0.32,<0.33; platform_system == 'Linux'"]
torch = ["torch>=2.8,<3", "safetensors>=0.6,<1", "numpy>=2,<3"]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[project.scripts]
harbichess-torch-loop = "harbichess.training.torch_loop:main"
harbichess-convert-mlx = "harbichess.backends.torch_network:main"
harbichess-mlx-smoke = "harbichess.backends.mlx_smoke:main"
harbichess-network-benchmark = "harbichess.benchmarks.network:main"
harbichess-search-benchmark = "harbichess.benchmarks.search:main"
harbichess-release-checkpoint = "harbichess.checkpoints.release:main"
harbichess-dashboard = "harbichess.dashboard.server:main"
harbichess-ocak-sanity = "harbichess.training.ocak_run:main"
harbichess-devir-arena = "harbichess.evaluation.arena:main"
harbichess-qualify-teacher = "harbichess.evaluation.teacher_qualification:main"
harbichess-diagnose-search = "harbichess.evaluation.search_diagnostics:main"
harbichess-diagnose-value-oracle = "harbichess.evaluation.value_oracle_diagnostics:main"
harbichess-diagnose-value-pipeline = "harbichess.evaluation.value_pipeline_diagnostics:main"
harbichess-bootstrap-value = "harbichess.training.value_bootstrap:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harbichess"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# CPU wheels fit the allocated Linux host. CUDA can be installed explicitly
# in a GPU environment without changing chess/model/checkpoint semantics.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
